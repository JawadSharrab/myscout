services:
  replica:
    # Local Internet Computer replica + backend canister deployment (dfx)
    build:
      context: .
      dockerfile: Dockerfile.base44
    volumes:
      - .:/app
      - dfx-cache:/root/.cache/dfinity
    environment:
      - DFX_NETWORK=local
    command: bash scripts/start-replica.sh
    restart: unless-stopped

  frontend:
    # Vite dev server serving the React frontend (live reload from source)
    build:
      context: .
      dockerfile: Dockerfile.base44
    depends_on:
      - replica
    volumes:
      - .:/app
    environment:
      - DFX_NETWORK=local
      - DFX_PROXY_TARGET=http://replica:4943
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    ports:
      - "3000:5173"
    command: bash scripts/start-frontend.sh
    restart: unless-stopped

volumes:
  dfx-cache:
