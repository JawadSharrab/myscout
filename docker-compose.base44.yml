services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      # Persist node_modules across container restarts without polluting the host
      - web_node_modules:/app/node_modules
      - web_frontend_node_modules:/app/src/frontend/node_modules
    ports:
      - "3000:5173"
    environment:
      # PocketIC server URL for the setup script
      - POCKETIC_URL=http://127.0.0.1:4943
      # Let Vite accept the preview's external hostname
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      # Pass through BASE44 vars so compose substitution resolves
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    command: bash dev-startup.sh
    restart: unless-stopped

volumes:
  web_node_modules:
  web_frontend_node_modules:
